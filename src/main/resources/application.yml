server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  config:
    # Lê o .env da pasta onde a aplicação roda. "optional": se não existir (ex.: no container), segue sem ele.
    # Variáveis de ambiente de verdade têm prioridade sobre o .env.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:order_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   # o payload já sai da outbox como JSON
      acks: all
      properties:
        enable.idempotence: true
        # quanto o send() pode travar esperando o broker (padrão 60s); com o broker fora,
        # o relay desiste rápido em vez de segurar o lock das linhas da outbox
        max.block.ms: 5000

app:
  kafka:
    topics:
      order-events: ${KAFKA_TOPIC_ORDER_EVENTS:order-events}
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      poll-interval-ms: 1000   # intervalo entre as leituras da outbox
      batch-size: 100
      send-timeout: 10s
    retention: 7d              # eventos publicados mais antigos que isso são apagados
    cleanup-cron: "0 0 3 * * *"   # todo dia às 03:00

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness e /readiness (úteis no Kubernetes)

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}   # em produção: SWAGGER_ENABLED=false
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
