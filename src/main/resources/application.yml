server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  config:
    # Lê o .env da pasta onde a aplicação roda. "optional": se não existir (ex.: no container), segue sem ele.
    # Variáveis de ambiente de verdade têm prioridade sobre o .env.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:order_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness e /readiness (úteis no Kubernetes)

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}   # em produção: SWAGGER_ENABLED=false
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
