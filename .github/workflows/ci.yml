name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Menor privilégio: o token do workflow só lê o repositório
permissions:
  contents: read

# Um push novo na mesma branch/PR cancela a execução anterior (economiza minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, testes e qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # histórico completo: o Sonar usa o blame para identificar "código novo"

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven   # cache do ~/.m2 baseado no hash do pom.xml

      - name: Cache do SonarQube Cloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # compile -> testes unitários (surefire) -> testes de integração (failsafe + Testcontainers) -> relatório JaCoCo
      - name: Build e testes
        run: ./mvnw -B -ntp verify

      - name: Publicar relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 7

      # TEMPORÁRIO: diagnóstico do SONAR_TOKEN (remover depois). Não imprime o valor do token.
      - name: Debug token Sonar
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "tamanho do token: ${#SONAR_TOKEN}"
          echo "validate:"
          curl -s -u "$SONAR_TOKEN:" https://sonarcloud.io/api/authentication/validate
          echo
          echo "organizacoes do usuario do token:"
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/organizations/search?member=true" | grep -o '"key":"[^"]*"' || echo "(nenhuma)"
          echo "projeto:"
          curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/components/show?component=Remuraa_order-service"
          echo

      # PRs vindos de fork não recebem secrets, então a análise é pulada nesses casos
      - name: Análise SonarQube Cloud + Quality Gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
